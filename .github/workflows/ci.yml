# Continuous integration and deployment.
#
# Two jobs, deliberately separated. The test job runs on every push and
# every pull request, on any branch, and is the merge gate. The deploy
# job runs only on push to main and only if the test job passed, so a
# red test suite cannot reach production.
#
# Building the image in the deploy job rather than the test job avoids
# paying build time on branches that will never ship.

name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

env:
  REGION: europe-west2
  REPO: clausegraph
  SERVICE: clausegraph

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        # Installs the locked versions rather than re-resolving, so CI
        # tests exactly what the Docker image will contain.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest -v --cov=src --cov-report=term-missing

  deploy:
    name: Build and deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        # Tagged with the commit SHA so every deployed revision traces
        # back to exact source, and with latest for convenience.
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}
        run: |
          docker build -f docker/Dockerfile \
            -t $IMAGE:${{ github.sha }} \
            -t $IMAGE:latest .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Deploy to Cloud Run
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image=$IMAGE:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=3 \
            --timeout=300 \
            --set-env-vars="ENVIRONMENT=production,LOG_LEVEL=INFO" \
            --set-secrets="GEMINI_API_KEY=gemini-api-key:latest" \
            --quiet

      - name: Smoke test the deployed revision
        # A deploy that returns success but serves errors is worse than
        # a failed deploy, because nothing alerts you. This fails the
        # workflow if the live service does not answer correctly.
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE }} \
            --region=${{ env.REGION }} --format='value(status.url)')
          echo "Deployed to $URL"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/health")
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed with HTTP $STATUS"
            exit 1
          fi
          echo "Health check passed"