[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clausegraph"
version = "0.1.0"
description = "Multi-agent contract risk analysis with hybrid RAG over UK legislation"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }

# Direct dependencies only, with lower bounds. The exact resolved
# versions are captured in requirements.lock.txt, which is what the
# Docker image installs. Declaring ranges here and locking separately
# keeps local upgrades easy while keeping builds reproducible.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]